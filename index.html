<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark Industries - Plain White Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="container">
        <header class="hero-section">
            <h1>Plain white shop</h1>
        </header>

        <section class="products-section">
            <div class="product-card">
                <h2>Product<br>Circulizer</h2>
                <button class="btn">Add to cart</button>
            </div>
            <div class="product-card">
                <h2>Darkshield<br>AI</h2>
                <button class="btn">Add to cart</button>
            </div>
            <div class="product-card">
                <h2>Risk<br>Network</h2>
                <button class="btn">Add to cart</button>
            </div>
        </section>

        <footer class="footer-section">
            <div class="marquee">
                business1 &nbsp; business2 &nbsp; business3 &nbsp; 
                <span class="central-text">used here,<br>used there<br>used everywhere</span>
                &nbsp; business4 &nbsp; business5
            </div>
            
            <div class="brand">
                <p class="copyright">copyright 2025</p>
                <p class="stark">STARK INDUSTRIES</p>
            </div>
        </footer>
    </main>

</body>
</html>
